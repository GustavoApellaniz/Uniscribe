[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uniscribe"
version = "0.1.0"
description = "Backend Python and Android client for UniScribe"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["uniscribe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
